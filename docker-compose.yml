services:
  aanbiedingnotifier:
    build: .
    # Of gebruik de kant-en-klare image uit GitHub Container Registry:
    # image: ghcr.io/<jouw-github-naam>/aanbiedingnotifier:latest
    container_name: aanbiedingnotifier
    restart: unless-stopped
    shm_size: 1gb            # Chromium heeft wat gedeeld geheugen nodig
    environment:
      - TZ=Europe/Amsterdam
      # Elke maandag om 08:00 (AH/Dirk/Deka/Jumbo/Plus starten hun actieweek rond maandag/woensdag)
      - SCHEDULE=0 8 * * 1
      - RUN_ON_START=true
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
