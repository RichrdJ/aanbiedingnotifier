services:
  aanbiedingnotifier:
    build: .
    # Of de kant-en-klare image (na `docker login ghcr.io`):
    # image: ghcr.io/richrdj/aanbiedingnotifier:latest
    container_name: aanbiedingnotifier
    restart: unless-stopped
    shm_size: 1gb            # Chromium heeft wat gedeeld geheugen nodig
    ports:
      - "4040:4040"          # GUI: http://<server-ip>:4040
    environment:
      - TZ=Europe/Amsterdam
      - RUN_ON_START=false   # scannen kan ook met de knop in de GUI
      # - GUI_PASSWORD=kies-een-wachtwoord   # aanraden als de GUI buiten je thuisnetwerk bereikbaar is
    volumes:
      - ./config:/config     # config.yaml wordt automatisch aangemaakt en is te bewerken via de GUI
      - ./data:/data
