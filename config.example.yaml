# Producten waar je op wilt letten. Er wordt gezocht in productnaam + merk
# (hoofdletterongevoelig). Een treffer moet ALLE woorden van de zoekterm bevatten.
# Optioneel een minimale korting per product: "monster 30%" of
#   - term: monster
#     min_discount: 30
keywords:
  - monster
  - fitmeals
  - kwark
  - red bull

# Standaard minimale korting (%) voor producten zonder eigen minimum. 0 = alles.
min_discount: 0
# Acties waarvan het percentage niet te bepalen is (bijv. "3 voor 4,00" zonder normale prijs) toch melden
include_unknown_discount: true

# Producten met deze woorden worden overgeslagen (optioneel)
exclude: []

# Welke winkels scannen
sources:
  ah: true
  jumbo: true
  lidl: true
  aldi: true
  dirk: true
  dekamarkt: true
  plus: true        # Coop NL is opgegaan in Plus; 'coop: true' werkt ook

# Wanneer scannen (cron: minuut uur dag maand weekdag). Ook in te stellen via de GUI.
schedule: "0 8 * * 1"

# Alleen melden wat je nog niet eerder gezien hebt (per actieperiode)
only_new: false

notify:
  # Gratis pushmeldingen via de ntfy-app (iOS/Android). Kies een lastig te raden topic.
  ntfy:
    enabled: true
    server: https://ntfy.sh
    topic: mijn-aanbiedingen-xyz123
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  discord:
    enabled: false
    webhook_url: ""
  pushover:
    enabled: false
    app_token: ""     # API-token van je Pushover-applicatie
    user_key: ""      # jouw user key
    device: ""        # optioneel
    priority: 0       # -2 t/m 1
